[workspace]
members = ["runtime"]
resolver = "2"

[workspace.package]
license = "MPL-2.0"
repository = "https://github.com/undivisible/anywhere"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true

[workspace.dependencies]
crepuscularity-web = { path = "../crepuscularity/crates/crepuscularity-web" }
crepuscularity-core = { path = "../crepuscularity/crates/crepuscularity-core" }
crepuscularity-webext = { path = "../crepuscularity/crates/crepuscularity-webext", features = ["wasm"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde-wasm-bindgen = "0.6"
wasm-bindgen = "=0.2.121"
js-sys = "0.3"
